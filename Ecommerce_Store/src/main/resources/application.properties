# ============================================================
# Ecommerce Store configuration
# All secrets are read from environment variables with safe
# defaults, so this file is safe to commit to GitHub.
#
# Local development: put your real DB password etc. in
# src/main/resources/application-local.properties (gitignored),
# or set the environment variables yourself.
# ============================================================

# "local" profile loads application-local.properties when it exists
# (it does not exist on the deployment server, so env vars + defaults win there)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database connection
# Local default: MySQL on localhost. On Render, SPRING_DATASOURCE_URL / DB_URL
# points to PostgreSQL and the driver is picked automatically.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Mail settings for password reset (use a real SMTP account / Gmail app password).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Thymeleaf (cache templates on the server)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Server (Render injects PORT automatically)
server.port=${PORT:8080}

# File upload limits (product / category / profile photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Razorpay payment gateway (Test mode)
# Key ID is safe to commit; Key Secret must come from an environment variable.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TZb7fZjl4PlhwB}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:WRONG_SECRET_FOR_TEST_MODE}
