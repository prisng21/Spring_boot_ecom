# Cloud profile (Render deployment) - activated by SPRING_PROFILES_ACTIVE=cloud.
# DB values are injected by Render (render.yaml wires them from the Postgres database).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_store}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Production-friendly settings
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
