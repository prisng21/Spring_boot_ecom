<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="UTF-8">
<title>RED WINGS Clothing | Admin Panel</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="/css/style.css">

<!-- DataTables CSS -->
<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<!-- DataTables JS -->
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>

<style type="text/css">
body {
	background-color: #f4f6f9;
}

/* Admin sidebar */
.admin-sidebar {
	min-height: calc(100vh - 56px);
	background: #1b1f2b;
}

.admin-sidebar .brand {
	color: #ffffff;
	font-weight: bold;
	text-decoration: none;
}

.admin-sidebar .nav-link {
	color: #c2c7d0;
	padding: 10px 16px;
	border-radius: 6px;
	margin: 2px 8px;
}

.admin-sidebar .nav-link i {
	width: 22px;
	text-align: center;
	margin-right: 8px;
}

.admin-sidebar .nav-link:hover {
	background-color: #2a3040;
	color: #ffffff;
}

.admin-sidebar .nav-link.active {
	background-color: #DC3545;
	color: #ffffff;
}

.admin-sidebar .sidebar-heading {
	font-size: .70rem;
	text-transform: uppercase;
	letter-spacing: .08em;
	color: #6c757d;
	padding: 12px 16px 4px;
}

/* keep the active category style used by admin category lists */
.list-group-item.active {
	z-index: 2;
	background-color: #DC3545;
	border-color: #DC3545;
}
</style>

</head>
<body>
	<!-- Start admin top navbar -->
	<nav class="navbar navbar-dark bg-dark sticky-top" style="height: 56px;">
		<div class="container-fluid">
			<a class="navbar-brand" href="/admin/"><i class="fa-solid fa-user-shield text-danger"></i> <b>RED WINGS <span class="text-danger">ADMIN</span></b></a>
			<ul class="navbar-nav ms-auto flex-row align-items-center">
				<li class="nav-item me-3">
					<a class="nav-link" href="/"><i class="fa-solid fa-store"></i> View Store</a>
				</li>
				<th:block th:if="${currentLoggedInUserDetails != null}">
					<li class="nav-item me-3 dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
							<i class="fas fa-user-check"></i> [[${currentLoggedInUserDetails.name}]]
						</a>
						<ul class="dropdown-menu dropdown-menu-end">
							<li><a class="dropdown-item" href="/admin/get-all-users"><i class="fas fa-users me-2"></i>Manage Users</a></li>
							<li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Profile</a></li>
						</ul>
					</li>
					<li class="nav-item">
						<a class="nav-link text-danger" href="/admin-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
					</li>
				</th:block>
			</ul>
		</div>
	</nav>
	<!-- End admin top navbar -->

	<div class="container-fluid">
		<div class="row">
			<!-- Start sidebar -->
			<nav class="col-md-3 col-lg-2 d-md-block admin-sidebar collapse" id="sidebarMenu">
				<div class="position-sticky pt-3">
					<p class="sidebar-heading">Main</p>
					<ul class="nav flex-column">
						<li class="nav-item">
							<a class="nav-link" href="/admin/"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/admin/category"><i class="fa-solid fa-layer-group"></i> Categories</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/admin/add-product"><i class="fa-solid fa-square-plus"></i> Add Product</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/admin/product-list"><i class="fa-solid fa-cube"></i> Products</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/admin/get-all-users"><i class="fa-solid fa-users"></i> Users</a>
						</li>
					</ul>
					<p class="sidebar-heading">Store</p>
					<ul class="nav flex-column">
						<li class="nav-item">
							<a class="nav-link" href="/"><i class="fa-solid fa-store"></i> Storefront</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/user/cart"><i class="fas fa-cart-shopping"></i> Cart [ [[${countCartForUser}]] ]</a>
						</li>
					</ul>
				</div>
			</nav>
			<!-- End sidebar -->

			<!-- Start main content -->
			<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
				<div th:replace="${content}"></div>
			</main>
			<!-- End main content -->
		</div>
	</div>

	<!-- Initialize Toast -->
	<script>
		$(document).ready(function() {
			if ($('.toast-body').text().trim() !== '') {
				var toastElement = $('.toast');
				var toast = new bootstrap.Toast(toastElement);
				toast.show();
			}else{
				toast.hide();
			}
		});
	</script>
	<!-- Initialize Toast -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</body>
</html>
