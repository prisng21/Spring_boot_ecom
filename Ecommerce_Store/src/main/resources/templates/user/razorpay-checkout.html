<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete Payment</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-light">
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow p-4 mb-5 bg-body rounded">
					<div class="card-body text-center">
						<h3 class="mb-3">Complete Your Payment</h3>
						<p class="text-muted">Amount to pay</p>
						<h2 class="mb-4">&#8377; <span id="amountText" th:text="${#numbers.formatDecimal(amountInPaise / 100.0, 1, 2)}">0.00</span></h2>

						<p class="text-muted mb-1">Razorpay Order ID</p>
						<p class="fw-bold">[[${razorpayOrderId}]]</p>

						<button id="payButton" class="btn btn-primary btn-lg col-12 mt-3">Pay Now</button>
						<a href="/" class="btn btn-outline-secondary col-12 mt-2">Cancel</a>

						<div id="paymentStatus" class="mt-3"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		var razorpayOrderId = /*[[${razorpayOrderId}]]*/ '';
		var razorpayKeyId = /*[[${razorpayKeyId}]]*/ '';
		var amountInPaise = /*[[${amountInPaise}]]*/ 0;
		var userName = /*[[${userName}]]*/ '';
		var userEmail = /*[[${userEmail}]]*/ '';
		var userMobile = /*[[${userMobile}]]*/ '';

		var options = {
			"key": razorpayKeyId,
			"amount": amountInPaise,
			"currency": "INR",
			"name": "Ecommerce Store",
			"description": "Order Payment",
			"order_id": razorpayOrderId,
			"prefill": {
				"name": userName,
				"email": userEmail,
				"contact": userMobile
			},
			"theme": {
				"color": "#dc3545"
			},
			"handler": function (response) {
				//send payment details to our server for signature verification
				fetch('/user/verify-payment', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/x-www-form-urlencoded'
					},
					body: new URLSearchParams({
						'razorpayOrderId': response.razorpay_order_id,
						'razorpayPaymentId': response.razorpay_payment_id,
						'razorpaySignature': response.razorpay_signature
					})
				})
				.then(function (res) { return res.json(); })
				.then(function (data) {
					if (data.status === 'success') {
						document.getElementById('paymentStatus').innerHTML =
							'<div class="alert alert-success">' + data.message + '</div>';
						setTimeout(function () { window.location.href = '/user/'; }, 2000);
					} else {
						document.getElementById('paymentStatus').innerHTML =
							'<div class="alert alert-danger">' + data.message + '</div>';
					}
				})
				.catch(function () {
					document.getElementById('paymentStatus').innerHTML =
						'<div class="alert alert-danger">Payment verification request failed.</div>';
				});
			},
			"modal": {
				"ondismiss": function () {
					document.getElementById('paymentStatus').innerHTML =
						'<div class="alert alert-warning">Payment cancelled. Your order is saved as pending payment.</div>';
				}
			}
		};

		var razorpayInstance = new Razorpay(options);
		document.getElementById('payButton').onclick = function (e) {
			e.preventDefault();
			razorpayInstance.open();
		};
	</script>
</body>
</html>
